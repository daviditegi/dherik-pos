<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DherikUrbanHome POS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--sf:#fff;--tx:#10222b;--mu:#5b6b73;--pr:#0b4a5a;--pr2:#073440;--ac:#f08a1c;--ok:#1f9d55;--wa:#d98a00;--er:#d33;--bd:#d6dee2}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1a20;--sf:#15262e;--tx:#e8f0f3;--mu:#93a6af;--bd:#2a404a}}
:root[data-theme=dark]{--bg:#0d1a20;--sf:#15262e;--tx:#e8f0f3;--mu:#93a6af;--bd:#2a404a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px Poppins,system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:10px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac)}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.a{background:var(--ac);color:#1b1000;border-color:var(--ac);font-weight:600}
button.g{background:var(--ok);color:#fff;border-color:var(--ok)}button.r{color:var(--er)}button:disabled{opacity:.4;cursor:not-allowed}
input,select{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);width:100%}
#app{height:100%;display:flex;flex-direction:column}
header{background:var(--pr2);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
header b{font-size:16px}header .sp{flex:1}header button{background:transparent;color:#fff;border-color:#ffffff55;padding:6px 10px}
header button.on{background:var(--ac);color:#1b1000;border-color:var(--ac)}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}.pill.ok{background:var(--ok)}.pill.off{background:var(--er)}
main{flex:1;min-height:0;display:flex}
.L{flex:1;display:flex;flex-direction:column;min-width:0;padding:10px;gap:8px}
.R{width:370px;background:var(--sf);border-left:1px solid var(--bd);display:flex;flex-direction:column;padding:10px;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.tabs button{white-space:nowrap;padding:7px 12px}.tabs button.on{background:var(--pr);color:#fff}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-content:start}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px;min-height:118px}
.tile .em{font-size:30px}.tile .n{font-weight:600;font-size:13px;line-height:1.25}.tile .pr{color:var(--pr);font-weight:700}
.st{font-size:11px;color:var(--mu)}.st.low{color:var(--wa);font-weight:600}.st.out{color:var(--er);font-weight:600}
.cart{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px;padding:8px;border:1px solid var(--bd);border-radius:10px}
.line .q{display:flex;align-items:center;gap:6px}.line .q button{padding:2px 10px;font-size:18px}
.tot{border-top:2px solid var(--bd);padding-top:8px}.tot div{display:flex;justify-content:space-between;margin:2px 0}.tot .big{font-size:22px;font-weight:700}
.row{display:flex;gap:6px}.row>*{flex:1}
.chg{font-size:18px;padding:16px;width:100%}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.md{background:var(--sf);border-radius:14px;padding:16px;width:min(560px,100%);max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.md h3{margin:0}.q5{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pg{padding:14px;overflow:auto;flex:1}.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}
.s-ok{color:var(--ok);font-weight:600}.s-wa{color:var(--wa);font-weight:600}.s-er{color:var(--er);font-weight:600}
.rc{font:12px/1.4 ui-monospace,Menlo,monospace;background:#fff;color:#000;padding:12px;width:300px;margin:auto;white-space:pre-wrap}
.lg{margin:auto;width:min(360px,92%);display:flex;flex-direction:column;gap:10px;text-align:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--pr2);color:#fff;padding:10px 18px;border-radius:10px;z-index:20;max-width:92%}
@media(max-width:820px){main{flex-direction:column}.R{width:100%;border-left:0;border-top:1px solid var(--bd);max-height:48%}}
@page{size:80mm auto;margin:0}@media print{body *{visibility:hidden}.rc,.rc *{visibility:visible}.rc{position:absolute;left:0;top:0;width:72mm;font-size:11px;padding:2mm}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body><div id="app"></div>
<script>
/* ===== PASTE YOUR SUPABASE DETAILS HERE (Project Settings -> API) ===== */
const SUPABASE_URL='https://mrudvlhzprczegyiiiph.supabase.co',SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ydWR2bGh6cHJjemVneWlpaXBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMjIwMjQsImV4cCI6MjExMDU5ODAyNH0.aFy4lblfK48tIpsJayvH_WgOy-bAmQ147eCQWFuktqQ';
/* ====================================================================== */
const $=s=>document.querySelector(s),K=n=>'KES '+Math.round(n).toLocaleString('en-KE');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['Beauty','Gas & Refills','Mattresses','Beddings','Phone Accessories','Electronics','Appliances','Utensils'];
const allCats=()=>[...new Set([...CATS,...DB.products.map(p=>p.cat)])];
const cfg=!SUPABASE_URL.includes('PASTE'),sb=cfg?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const DB={products:[],sales:[],shifts:[],cash:[],customers:[],codes:[],cur:null,held:JSON.parse(localStorage.getItem('dub_held')||'[]')};
const saveHeld=()=>{try{localStorage.setItem('dub_held',JSON.stringify(DB.held))}catch(e){}};
let U=null,cart=[],disc={t:'amt',v:0},cust=null,cat='All',q='',view='sell',offline=!navigator.onLine,lock,rt,subbed=false;
const can=r=>U&&(r=='cashier'||(r=='manager'&&U.role!='cashier')||(r=='admin'&&U.role=='admin'));
const isP=id=>/^[0-9a-f]{8}-/.test(id);
const log=a=>{sb.rpc('log_action',{a})};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
function modal(h){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="md">'+h+'</div>';document.body.append(o);o.close=()=>o.remove();return o}
async function rpc(n,a){const r=await sb.rpc(n,a);if(r.error){const m=r.error.message;toast(m.includes('mpesa_codes')?'That M-Pesa code was already used on another sale':m);return null}return r.data}
async function ok(p){const r=await p;if(r.error){toast(r.error.message);return false}return true}
const mapP=p=>({id:p.id,cat:p.category,name:p.name,price:+p.price,cost:+p.cost,stock:p.stock,img:p.img,em:p.emoji,sku:p.sku});
const mapSale=r=>({id:r.id,no:r.no,t:Date.parse(r.created_at),cashier:r.cashier,source:r.source,items:r.items,sub:+r.subtotal,disc:+r.discount,total:+r.total,pays:r.pays,cust:r.customer,status:r.status,refund:r.refund,shift:r.shift_id});
async function loadAll(){
 const [p,s,c,k,sh,cm]=await Promise.all([sb.from('products').select('*').order('name'),sb.from('sales').select('*').order('created_at',{ascending:false}).limit(500),sb.from('customers').select('*'),sb.from('mpesa_codes').select('code'),sb.from('shifts').select('*').order('opened_at',{ascending:false}).limit(200),sb.from('cash_moves').select('*')]);
 DB.products=(p.data||[]).map(mapP);DB.sales=(s.data||[]).map(mapSale);DB.customers=(c.data||[]).map(x=>({name:x.name,phone:x.phone,bal:+x.balance}));
 DB.codes=(k.data||[]).map(x=>x.code);DB.shifts=sh.data||[];DB.cash=(cm.data||[]).map(x=>({shift:x.shift_id,amt:+x.amount,r:x.reason}));
 DB.cur=DB.shifts.find(x=>x.cashier_id==U.id&&!x.closed_at)||null;if(DB.cur)DB.cur={...DB.cur,float:+DB.cur.float,open:Date.parse(DB.cur.opened_at)};
}
async function enter(user){const {data}=await sb.from('profiles').select('*').eq('id',user.id).single();U={id:user.id,n:data?.name||user.email,role:data?.role||'cashier'};await loadAll();
 if(!subbed){subbed=true;sb.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'products'},()=>{clearTimeout(rt);rt=setTimeout(liveProducts,300)}).subscribe()}
 render()}
async function liveProducts(){if(!U)return;const r=await sb.from('products').select('*').order('name');if(r.data){DB.products=r.data.map(mapP);if(view=='sell')grid();else if(view=='stock')render()}}
async function signOut(){await sb.auth.signOut();U=null;cart=[];render()}
function resetLock(){clearTimeout(lock);if(U)lock=setTimeout(signOut,300000)}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,resetLock));
addEventListener('online',()=>{offline=false;if(U)render()});addEventListener('offline',()=>{offline=true;if(U)render()});
const sub=()=>cart.reduce((a,l)=>a+l.price*l.qty,0),dAmt=()=>Math.min(sub(),disc.t=='pct'?sub()*disc.v/100:disc.v),total=()=>Math.round(sub()-dAmt());

function render(){
 const a=$('#app');
 if(!cfg){a.innerHTML='<div class="lg card"><h2>Setup needed</h2><p>Open <b>index.html</b> and paste your Supabase Project URL and anon key at the top of the script, then save and reload.</p></div>';return}
 if(!U){a.innerHTML='<form class="lg card" id="lf"><h2 style="margin:0">DherikUrbanHome</h2><p style="color:var(--mu);margin:0">Matuguta · Staff sign in</p><input id="em" type="email" placeholder="Email" autocomplete="username" required><input id="pw" type="password" placeholder="PIN / password" autocomplete="current-password" required><button class="a chg" id="go">Sign in</button></form>';
  $('#lf').onsubmit=async e=>{e.preventDefault();$('#go').disabled=true;const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error){toast('Wrong email or password');$('#go').disabled=false;return}await enter(r.data.user)};return}
 const nav=[['sell','Sell'],['sales','Sales'],['shift','Shift'],['stock','Stock']];
 a.innerHTML=`<header><b>DherikUrbanHome POS</b><span class="pill ${offline?'off':'ok'}">${offline?'Offline':'Online'}</span>${nav.map(n=>`<button class="${view==n[0]?'on':''}" data-v="${n[0]}">${n[1]}</button>`).join('')}<span class="sp"></span><span>${esc(U.n)} (${U.role})</span><button id="th">◐</button><button id="lk">Sign out</button></header><main id="m"></main>`;
 a.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
 $('#lk').onclick=signOut;$('#th').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'light':'dark'};
 ({sell:vSell,sales:vSales,shift:vShift,stock:vStock})[view]();
}
/* SELL */
function vSell(){
 $('#m').innerHTML=`<div class="L"><input id="q" placeholder="Search name, SKU or scan barcode (F2)" value="${esc(q)}"><div class="tabs">${['All',...allCats()].map(c=>`<button class="${cat==c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="grid" id="g"></div></div>
 <div class="R"><div class="row"><button id="cu">${cust?'👤 '+esc(cust.name):'+ Customer'}</button><button id="ms">+ Misc item</button></div><div class="cart" id="ct"></div><div class="tot" id="tt"></div><div class="row"><button id="hd">Hold</button><button id="rc">Recall (${DB.held.length})</button><button id="ds">Discount</button></div><button class="a chg" id="ch">Charge (F4)</button></div>`;
 $('#m').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;render()});
 const qi=$('#q');qi.oninput=()=>{q=qi.value;grid()};
 qi.onkeydown=e=>{if(e.key=='Enter'){const p=DB.products.find(p=>p.sku.toLowerCase()==qi.value.trim().toLowerCase());if(p){add(p);q='';qi.value='';grid()}}};
 $('#ms').onclick=miscItem;$('#cu').onclick=custPick;$('#hd').onclick=hold;$('#rc').onclick=recall;$('#ds').onclick=discount;$('#ch').onclick=charge;grid();cartUI();
}
function grid(){
 const g=$('#g');if(!g)return;const s=q.toLowerCase(),L=DB.products.filter(p=>(cat=='All'||p.cat==cat)&&(!s||p.name.toLowerCase().includes(s)||p.sku.toLowerCase().includes(s)));
 g.innerHTML=L.map(p=>`<button class="tile" data-id="${p.id}">${p.img?`<img src="${p.img}" alt="" style="height:56px;width:100%;object-fit:cover;border-radius:8px">`:`<span class="em">${esc(p.em||'📦')}</span>`}<span class="n">${esc(p.name)}</span><span class="pr">${K(p.price)}</span><span class="st ${p.stock<=0?'out':p.stock<=5?'low':''}">${p.stock<=0?'Out of stock':p.stock<=5?'Low: '+p.stock+' left':p.stock+' in stock'}</span></button>`).join('')||'<p>No products yet. Add them in the Stock tab.</p>';
 g.querySelectorAll('.tile').forEach(b=>b.onclick=()=>add(DB.products.find(p=>p.id==b.dataset.id)));
}
function add(p){
 const l=cart.find(x=>x.id==p.id),n=(l?l.qty:0)+1;
 if(n>p.stock&&isP(p.id)){if(!can('manager')){toast(p.stock<=0?'Out of stock. Ask a manager to override.':'Only '+p.stock+' left. Ask a manager.');return}
  if(!confirm('Stock is '+p.stock+'. Override and sell anyway?'))return;log('stock override '+p.name)}
 l?l.qty++:cart.push({id:p.id,name:p.name,price:p.price,qty:1});cartUI()}
function cartUI(){
 $('#ct').innerHTML=cart.map((l,i)=>`<div class="line"><div><b>${esc(l.name)}</b><br><span class="st">${K(l.price)} each</span></div><b>${K(l.price*l.qty)}</b><div class="q"><button data-d="${i}">−</button>${l.qty}<button data-u="${i}">+</button></div><button class="r" data-x="${i}">Remove</button></div>`).join('')||'<p class="st">Tap a product or scan a barcode to start.</p>';
 $('#ct').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const l=cart[b.dataset.d];if(--l.qty<1)cart.splice(b.dataset.d,1);cartUI()});
 $('#ct').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{add(DB.products.find(p=>p.id==cart[b.dataset.u].id)||{stock:9e9,...cart[b.dataset.u]})});
 $('#ct').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{cart.splice(b.dataset.x,1);cartUI()});
 $('#tt').innerHTML=`<div><span>Subtotal</span><span>${K(sub())}</span></div><div><span>Discount</span><span>−${K(dAmt())}</span></div><div class="big"><span>Total</span><span>${K(total())}</span></div>`;$('#ch').disabled=!cart.length;
}
function miscItem(){const m=modal('<h3>Misc item</h3><input id="mn" placeholder="Item name"><input id="mp" type="number" inputmode="numeric" placeholder="Price (KES)"><div class="row"><button id="c">Cancel</button><button class="p" id="o">Add</button></div>');
 m.querySelector('#c').onclick=m.close;m.querySelector('#o').onclick=()=>{const n=m.querySelector('#mn').value.trim(),p=+m.querySelector('#mp').value;if(!n||p<=0)return toast('Enter name and price');cart.push({id:'m'+Date.now(),name:n,price:p,qty:1});m.close();cartUI()}}
function discount(){if(!can('manager'))return toast('Only a manager can give discounts');
 const m=modal(`<h3>Discount</h3><div class="row"><select id="dt"><option value="amt">Amount (KES)</option><option value="pct">Percent (%)</option></select><input id="dv" type="number" value="${disc.v}"></div><div class="row"><button id="c">Cancel</button><button class="p" id="o">Apply</button></div>`);
 m.querySelector('#c').onclick=m.close;m.querySelector('#o').onclick=()=>{disc={t:m.querySelector('#dt').value,v:Math.max(0,+m.querySelector('#dv').value)};log('discount '+disc.v+disc.t);m.close();cartUI()}}
const ph=v=>{v=v.replace(/\D/g,'');if(/^0[17]\d{8}$/.test(v))return '254'+v.slice(1);if(/^254[17]\d{8}$/.test(v))return v;return null};
function custPick(){const m=modal(`<h3>Customer</h3><input id="cn" placeholder="Name"><input id="cp" placeholder="Phone 07XX…"><div class="st">Existing: ${DB.customers.map(c=>`<a href="#" data-p="${c.phone}">${esc(c.name)}</a>`).join(', ')||'none'}</div><div class="row"><button id="c">Cancel</button><button class="p" id="o">Attach</button></div>`);
 m.querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{e.preventDefault();cust=DB.customers.find(c=>c.phone==a.dataset.p);m.close();render()});
 m.querySelector('#c').onclick=m.close;
 m.querySelector('#o').onclick=async()=>{const n=m.querySelector('#cn').value.trim(),p=ph(m.querySelector('#cp').value);if(!n||!p)return toast('Enter name and valid phone');
  let c=DB.customers.find(c=>c.phone==p);if(!c){const r=await sb.from('customers').insert({name:n,phone:p}).select().single();if(r.error)return toast(r.error.message);c={name:r.data.name,phone:r.data.phone,bal:0};DB.customers.push(c)}cust=c;m.close();render()}}
function hold(){if(!cart.length)return;DB.held.push({cart,disc,cust,t:Date.now()});cart=[];disc={t:'amt',v:0};cust=null;saveHeld();toast('Sale held on this device');render()}
function recall(){if(!DB.held.length)return toast('No held sales');const m=modal('<h3>Held sales</h3>'+DB.held.map((h,i)=>`<button data-i="${i}">${new Date(h.t).toLocaleTimeString()} · ${h.cart.length} items · ${K(h.cart.reduce((a,l)=>a+l.price*l.qty,0))}${h.cust?' · '+esc(h.cust.name):''}</button>`).join('')+'<button id="c">Close</button>');
 m.querySelector('#c').onclick=m.close;m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const h=DB.held.splice(b.dataset.i,1)[0];cart=h.cart;disc=h.disc;cust=h.cust;saveHeld();m.close();render()})}
/* PAYMENT */
function charge(){
 if(!cart.length)return;if(offline)return toast('No internet. The shared system needs a connection to record sales.');if(!DB.cur)return toast('Open a shift first (Shift tab)');
 const T=total();let pays=[];const paid=()=>pays.reduce((a,p)=>a+p.amt,0);const m=modal('');
 const draw=()=>{const due=T-paid();
  if(due<=0){m.innerHTML='<h3>Saving sale…</h3>';finish(pays,T).then(good=>{if(good)m.close();else{pays.pop();draw()}});return}
  m.innerHTML=`<h3>Pay ${K(T)}</h3>${pays.length?`<div class="st">Paid: ${pays.map(p=>p.m+' '+K(p.amt)).join(', ')}</div><b>Remaining ${K(due)}</b>`:''}<div class="row"><button data-m="cash">Cash</button><button data-m="stk">M-Pesa STK</button><button data-m="till">Till/Paybill</button><button data-m="credit">Credit</button></div><div id="pb"></div><button id="x">Cancel</button>`;
  m.querySelector('#x').onclick=m.close;m.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>method(b.dataset.m,due))};
 const method=(k,due)=>{const pb=m.querySelector('#pb'),amt=`<label class="st">Amount for this payment</label><input id="am" type="number" value="${due}">`;
  if(k=='cash'){pb.innerHTML=`<label class="st">Cash received</label><input id="am" type="number" value="${due}"><div class="q5">${[100,200,500,1000,2000,due].map(v=>`<button data-v="${v}">${v==due?'Exact':v}</button>`).join('')}</div><div id="chg" class="big s-ok"></div><button class="g" id="go">Confirm cash</button>`;
   const upd=()=>{const r=+pb.querySelector('#am').value;pb.querySelector('#chg').textContent=r>=due?'Change: '+K(r-due):'Short by '+K(due-r)};upd();
   pb.querySelector('#am').oninput=upd;pb.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{pb.querySelector('#am').value=b.dataset.v;upd()});
   pb.querySelector('#go').onclick=()=>{const r=+pb.querySelector('#am').value;if(r<=0)return;pays.push({m:'Cash',amt:Math.min(r,due),given:r,change:r>due?r-due:0});draw()}}
  if(k=='stk'){pb.innerHTML=`${amt}<input id="ph" placeholder="Customer phone 07XX / 01XX / 2547XX" value="${cust?.phone||''}"><button class="p" id="go">Send STK Push</button><div id="stt"></div>`;
   pb.querySelector('#go').onclick=()=>{const n=ph(pb.querySelector('#ph').value),a=Math.min(due,+pb.querySelector('#am').value);if(!n)return toast('Invalid phone');
    const s=pb.querySelector('#stt');s.innerHTML=`<p class="s-wa">Waiting for customer to enter PIN on ${n}…</p><div class="st">Demo mode: real Safaricom STK is the next step.</div><div class="row"><button class="g" id="ok">Simulate success</button><button class="r" id="no">Simulate failure</button></div>`;
    s.querySelector('#ok').onclick=()=>{pays.push({m:'M-Pesa STK',amt:a,code:'S'+Math.random().toString(36).slice(2,11).toUpperCase(),phone:n});draw()};
    s.querySelector('#no').onclick=()=>{s.innerHTML='<p class="s-er">Payment failed or cancelled.</p><button class="p" id="rt">Retry</button> <button id="sw">Use another method</button>';s.querySelector('#rt').onclick=()=>method('stk',due);s.querySelector('#sw').onclick=draw}}}
  if(k=='till'){pb.innerHTML=`${amt}<input id="cd" placeholder="M-Pesa code (e.g. QKA7T2X9LM)" style="text-transform:uppercase"><button class="g" id="go">Confirm payment</button>`;
   pb.querySelector('#go').onclick=()=>{const c=pb.querySelector('#cd').value.trim().toUpperCase();if(!/^[A-Z0-9]{10}$/.test(c))return toast('Code must be 10 letters/digits');if(DB.codes.includes(c)||pays.some(p=>p.code==c))return toast('That code was already used on another sale');
    pays.push({m:'M-Pesa Till',amt:Math.min(due,+pb.querySelector('#am').value),code:c});draw()}}
  if(k=='credit'){if(!cust)return pb.innerHTML='<p class="s-er">Attach a customer first (close this and tap + Customer).</p>';
   pb.innerHTML=`<p>Add ${K(due)} to ${esc(cust.name)}'s account (balance ${K(cust.bal)})?</p><button class="p" id="go">Record on credit</button>`;pb.querySelector('#go').onclick=()=>{pays.push({m:'Credit',amt:due});draw()}}};
 draw();
}
async function finish(pays,T){
 const items=cart.map(l=>({id:isP(l.id)?l.id:null,name:l.name,price:l.price,qty:l.qty}));
 const r=await rpc('create_sale',{p_items:items,p_discount:dAmt(),p_pays:pays,p_customer:cust?{name:cust.name,phone:cust.phone}:null,p_shift:DB.cur.id,p_override:can('manager')});
 if(!r)return false;cart=[];disc={t:'amt',v:0};cust=null;await loadAll();render();receipt(mapSale(r));return true}
function rtext(s){const W=32,ln=(a,b)=>a+' '.repeat(Math.max(1,W-a.length-b.length))+b;
 return ['DHERIKURBANHOME','MATUGUTA','Tel 0758270793 / 0721620227','-'.repeat(W),'Receipt: '+s.no+(s.status=='refunded'?' (REFUNDED)':''),new Date(s.t).toLocaleString('en-KE'),'Cashier: '+s.cashier,s.cust?'Customer: '+s.cust.name:'','-'.repeat(W),
 ...s.items.map(l=>l.name+'\n'+ln('  '+l.qty+' x '+Math.round(l.price),Math.round(l.qty*l.price).toLocaleString())),'-'.repeat(W),
 ln('Subtotal',Math.round(s.sub).toLocaleString()),s.disc?ln('Discount','-'+Math.round(s.disc)):'',ln('TOTAL KES',s.total.toLocaleString()),'-'.repeat(W),
 ...s.pays.map(p=>ln(p.m,Math.round(p.amt).toLocaleString())+(p.code?'\n  M-Pesa code: '+p.code:'')+(p.change?'\n  Change: '+p.change:'')),'','Thank you for shopping with us!','WhatsApp 0758270793'].filter(x=>x!=='').join('\n')}
function receipt(s){const t=rtext(s),m=modal(`<div class="rc">${esc(t)}</div><div class="row"><button class="p" id="pr">Print</button><button id="wa">WhatsApp</button><button id="nw" class="a">New sale</button></div>`);
 m.querySelector('#pr').onclick=()=>print();m.querySelector('#nw').onclick=m.close;
 m.querySelector('#wa').onclick=()=>{const n=s.cust?.phone||prompt('Customer WhatsApp number');const p=n&&ph(n);if(p)open('https://wa.me/'+p+'?text='+encodeURIComponent(t))}}
/* SALES */
function vSales(){
 $('#m').innerHTML=`<div class="pg"><input id="sq" placeholder="Find by receipt no, phone or customer" style="margin-bottom:10px"><div class="card" style="overflow:auto"><table><thead><tr><th>Receipt</th><th>Time</th><th>Cashier</th><th>Pay</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="sb"></tbody></table></div></div>`;
 const draw=()=>{const f=$('#sq').value.toLowerCase();$('#sb').innerHTML=DB.sales.filter(s=>!f||(s.no+(s.cust?.phone||'')+(s.cust?.name||'')).toLowerCase().includes(f)).map(s=>`<tr><td>${s.no}</td><td>${new Date(s.t).toLocaleString('en-KE')}</td><td>${esc(s.cashier)}</td><td>${[...new Set(s.pays.map(p=>p.m))].join('+')}</td><td>${K(s.total)}</td><td class="${s.status=='paid'?'s-ok':'s-er'}">${s.status}</td><td><button data-r="${s.no}">Reprint</button> ${s.status=='paid'&&can('manager')?`<button class="r" data-f="${s.no}">Refund</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>No sales yet.</td></tr>';
  $('#sb').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>receipt(DB.sales.find(s=>s.no==b.dataset.r)));
  $('#sb').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>refund(DB.sales.find(s=>s.no==b.dataset.f)))};
 $('#sq').oninput=draw;draw()}
function refund(s){const m=modal(`<h3>Refund ${s.no} (${K(s.total)})</h3><input id="rs" placeholder="Reason (required)"><label><input type="checkbox" id="dm" style="width:auto"> Items damaged (do not restock)</label><select id="rm"><option>Cash</option><option>M-Pesa (manual record)</option></select><div class="row"><button id="c">Cancel</button><button class="r" id="o">Refund in full</button></div>`);
 m.querySelector('#c').onclick=m.close;m.querySelector('#o').onclick=async()=>{const r=m.querySelector('#rs').value.trim();if(!r)return toast('Enter a reason');
  if(await ok(sb.rpc('refund_sale',{p_sale:s.id,p_reason:r,p_method:m.querySelector('#rm').value,p_restock:!m.querySelector('#dm').checked}))){m.close();await loadAll();render()}}}
/* SHIFT */
function zrep(sh){const S=DB.sales.filter(s=>s.shift==sh.id),P=f=>S.filter(s=>s.status=='paid').flatMap(s=>s.pays).filter(p=>f(p.m)).reduce((a,p)=>a+p.amt,0);
 const ref=DB.sales.filter(s=>s.refund?.shift==sh.id),refCash=ref.filter(s=>s.refund.method=='Cash').reduce((a,s)=>a+s.total,0),io=DB.cash.filter(c=>c.shift==sh.id).reduce((a,c)=>a+c.amt,0),cash=P(m=>m=='Cash'),fl=+sh.float;
 return{total:S.filter(s=>s.status=='paid').reduce((a,s)=>a+s.total,0),cash,mp:P(m=>m.startsWith('M-Pesa')),cr:P(m=>m=='Credit'),ref:ref.reduce((a,s)=>a+s.total,0),dis:S.reduce((a,s)=>a+s.disc,0),io,exp:fl+cash-refCash+io}}
function vShift(){const sh=DB.cur;
 const mgr=can('manager')?`<div class="card" style="overflow:auto"><h3>All shifts</h3><table><thead><tr><th>Cashier</th><th>Opened</th><th>Closed</th><th>Sales</th><th>Variance</th></tr></thead><tbody>${DB.shifts.slice(0,30).map(x=>`<tr><td>${esc(x.cashier)}</td><td>${new Date(x.opened_at).toLocaleString('en-KE')}</td><td>${x.closed_at?new Date(x.closed_at).toLocaleString('en-KE'):'<span class="s-ok">Open now</span>'}</td><td>${K(zrep({id:x.id,float:x.float}).total)}</td><td class="${x.variance<0?'s-er':''}">${x.closed_at?K(x.variance):'-'}</td></tr>`).join('')}</tbody></table></div>`:'';
 if(!sh){$('#m').innerHTML=`<div class="pg"><div class="card"><h3>Open shift</h3><input id="fl" type="number" placeholder="Opening cash float (KES)"><br><br><button class="a" id="o">Open shift</button></div>${mgr}</div>`;
  $('#o').onclick=async()=>{if(await ok(sb.from('shifts').insert({cashier_id:U.id,cashier:U.n,float:+$('#fl').value||0}))){log('shift open');await loadAll();render()}};return}
 const z=zrep(sh);
 $('#m').innerHTML=`<div class="pg"><div class="card"><h3>Shift ${esc(sh.cashier)} · since ${new Date(sh.open).toLocaleTimeString()}</h3><table>${Object.entries({'Total sales':K(z.total),'Cash sales':K(z.cash),'M-Pesa sales':K(z.mp),'Credit sales':K(z.cr),'Refunds':K(z.ref),'Discounts':K(z.dis),'Opening float':K(sh.float),'Cash in/out':K(z.io),'Expected cash':K(z.exp)}).map(([a,b])=>`<tr><td>${a}</td><td><b>${b}</b></td></tr>`).join('')}</table></div>
 <div class="card"><h3>Cash in / out</h3><div class="row"><select id="io"><option value="1">Cash in</option><option value="-1">Cash out (expense/banking)</option></select><input id="ia" type="number" placeholder="Amount"><input id="ir" placeholder="Reason"></div><br><button id="ig">Record</button></div>
 <div class="card"><h3>Close shift</h3><input id="cc" type="number" placeholder="Counted cash (KES)"><br><br><button class="p" id="cl">Close shift and show Z report</button></div>${mgr}</div>`;
 $('#ig').onclick=async()=>{const a=+$('#ia').value,r=$('#ir').value.trim();if(!a||!r)return toast('Amount and reason required');if(await ok(sb.from('cash_moves').insert({shift_id:sh.id,amount:a*$('#io').value,reason:r,by_name:U.n}))){log('cash io '+a+' '+r);await loadAll();render()}};
 $('#cl').onclick=async()=>{const c=$('#cc').value;if(c==='')return toast('Enter counted cash');const v=+c-z.exp;
  if(!await ok(sb.from('shifts').update({closed_at:new Date().toISOString(),counted:+c,variance:v}).eq('id',sh.id)))return;log('shift close var '+v);
  const m=modal(`<h3>Z report</h3><div class="rc">Z REPORT · ${esc(sh.cashier)}\n${new Date(sh.open).toLocaleString()} to ${new Date().toLocaleString()}\nTotal sales: ${Math.round(z.total)}\nCash: ${Math.round(z.cash)}  M-Pesa: ${Math.round(z.mp)}\nCredit: ${Math.round(z.cr)}  Refunds: ${Math.round(z.ref)}\nDiscounts: ${Math.round(z.dis)}\nExpected cash: ${Math.round(z.exp)}\nCounted: ${Math.round(+c)}\nVariance: ${Math.round(v)}</div><div class="row"><button id="p" class="p">Print</button><button id="d">Done</button></div>`);
  m.querySelector('#p').onclick=()=>print();m.querySelector('#d').onclick=async()=>{m.close();await loadAll();render()}}}
/* STOCK */
function vStock(){const mg=can('manager'),paid=DB.sales.filter(s=>s.status=='paid');
 const profit=paid.reduce((a,s)=>a+s.items.reduce((b,l)=>b+(l.price-l.cost)*l.qty,0)-s.disc,0);
 $('#m').innerHTML=`<div class="pg">${mg?'<div class="card row" style="flex-wrap:wrap"><button class="a" id="np">+ Add product</button><button id="ic">Import CSV</button><button id="ec">Export CSV</button></div>':''}<div class="card">Sales total ${K(paid.reduce((a,s)=>a+s.total,0))} · Est. profit ${K(profit)} · Credit owed ${K(DB.customers.reduce((a,c)=>a+c.bal,0))}</div>
 <div class="card" style="overflow:auto"><table><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody>${DB.products.map(p=>`<tr><td>${esc(p.em)} ${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${K(p.price)}</td><td class="${p.stock<=0?'s-er':p.stock<=5?'s-wa':''}">${p.stock}</td><td>${mg?`<button data-a="${p.id}">Adjust</button> <button data-e="${p.id}">Edit</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
 if(!mg)return;$('#np').onclick=()=>prodForm();$('#ec').onclick=exportCSV;$('#ic').onclick=importCSV;
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>prodForm(DB.products.find(p=>p.id==b.dataset.e)));
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const p=DB.products.find(p=>p.id==b.dataset.a);
  const m=modal(`<h3>${esc(p.name)}</h3><input id="n" type="number" placeholder="Change (+received / −damaged)"><select id="r"><option>Received stock</option><option>Damaged</option><option>Lost</option><option>Recount</option></select><div class="row"><button id="c">Cancel</button><button class="p" id="o">Save</button></div>`);
  m.querySelector('#c').onclick=m.close;m.querySelector('#o').onclick=async()=>{const n=+m.querySelector('#n').value;if(!n)return;if(await ok(sb.rpc('adjust_stock',{p_id:p.id,p_delta:n,p_reason:m.querySelector('#r').value}))){m.close();await liveProducts()}}})}
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
function pick(ac,cb){const i=document.createElement('input');i.type='file';i.accept=ac;i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()}
function exportCSV(){const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';dl('products.csv',['name,category,sku,price,cost,stock',...DB.products.map(p=>[p.name,p.cat,p.sku,p.price,p.cost,p.stock].map(c).join(','))].join('\n'),'text/csv')}
function parseCSV(t){const r=[];let row=[],c='',qq=false;for(let i=0;i<t.length;i++){const ch=t[i];if(qq){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')qq=false;else c+=ch}else if(ch=='"')qq=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';if(row.some(x=>x.trim()))r.push(row);row=[]}else c+=ch}row.push(c);if(row.some(x=>x.trim()))r.push(row);return r}
function importCSV(){pick('.csv,text/csv',f=>f.text().then(async t=>{const R=parseCSV(t),h=(R.shift()||[]).map(x=>x.trim().toLowerCase()),ix=k=>h.indexOf(k);if(ix('name')<0)return toast('CSV needs header: name,category,sku,price,cost,stock');
 const rows=R.filter(r=>(r[ix('name')]||'').trim()).map((r,i)=>({name:r[ix('name')].trim(),category:(r[ix('category')]||'Beauty').trim(),sku:(r[ix('sku')]||'').trim()||'SKU'+Date.now()+i,price:+r[ix('price')]||0,cost:+r[ix('cost')]||0,stock:Math.round(+r[ix('stock')]||0)}));
 if(await ok(sb.from('products').upsert(rows,{onConflict:'sku'}))){log('import '+rows.length+' products');toast(rows.length+' products imported');await liveProducts()}}))}
function prodForm(p){const isNew=!p;p=p||{cat:CATS[0],name:'',price:0,cost:0,stock:0,sku:'',em:'📦'};let img=p.img;
 const m=modal(`<h3>${isNew?'Add':'Edit'} product</h3><input id="fa" placeholder="Product name" value="${esc(p.name)}"><select id="fb">${allCats().map(c=>`<option ${c==p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="row"><input id="fc" type="number" placeholder="Selling price" value="${p.price}"><input id="fd" type="number" placeholder="Cost price" value="${p.cost}"></div><div class="row"><input id="fe" type="number" placeholder="Stock" value="${p.stock}" ${isNew?'':'disabled title="Use Adjust to change stock"'}><input id="ff" placeholder="SKU / barcode" value="${esc(p.sku)}"></div><label class="st">Photo (optional)</label><input id="fg" type="file" accept="image/*"><div class="row"><button id="fx">Cancel</button>${isNew?'':'<button class="r" id="fdl">Delete</button>'}<button class="p" id="fs">Save</button></div>`);
 m.querySelector('#fx').onclick=m.close;
 m.querySelector('#fg').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.6);toast('Photo ready')};im.src=URL.createObjectURL(f)};
 if(!isNew)m.querySelector('#fdl').onclick=async()=>{if(!can('admin'))return toast('Admin only');if(confirm('Delete this product?')&&await ok(sb.from('products').delete().eq('id',p.id))){log('deleted '+p.name);m.close();await liveProducts()}};
 m.querySelector('#fs').onclick=async()=>{const g=i=>m.querySelector('#'+i).value.trim(),name=g('fa'),price=+g('fc'),sku=g('ff')||'SKU'+Date.now();if(!name||price<=0)return toast('Name and price required');
  const row={name,category:g('fb'),price,cost:+g('fd')||0,sku,img:img||null};if(isNew)row.stock=Math.round(+g('fe')||0);
  const good=isNew?await ok(sb.from('products').insert(row)):await ok(sb.from('products').update({...row,updated_at:new Date().toISOString()}).eq('id',p.id));
  if(good){if(!isNew&&p.price!=price)log(`price ${p.name} ${p.price}->${price}`);log((isNew?'added ':'edited ')+name);m.close();await liveProducts()}}}
addEventListener('keydown',e=>{if(!U||view!='sell')return;if(e.key=='F2'){e.preventDefault();$('#q')?.focus()}if(e.key=='F4'){e.preventDefault();charge()}if(e.key=='Escape')document.querySelector('.ov')?.remove()});
(async()=>{if(cfg){const {data}=await sb.auth.getSession();if(data.session)return enter(data.session.user)}render()})();
